<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0d0b1e" />
  <title>Kwalify Benchmark — History</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root { --bg: #0f0a1a; --card: #1a1228; --text: #f3e8ff; --muted: #c4b5fd; --accent: #a855f7; --ok: #4ade80; --bad: #f87171; --line: #3b2667; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; max-width: 960px; }
    h1 { color: var(--accent); margin: 0 0 4px; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .ok { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    a { color: var(--accent); }
    code { background: #12091f; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .history-cards { display: none; }
    .history-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .history-card h3 { margin: 0 0 6px; font-size: 15px; }
    .history-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    @media (max-width: 720px) {
      .history-table-wrap table { display: none; }
      .history-cards { display: block; }
    }
  </style>
</head>
<body>
  <h1>Benchmark History</h1>
  <p class="sub">Last 20 runs from <code>reports/benchmark-history.json</code>. <a href="/benchmark#live-dashboard">Live</a> · <a href="benchmark-guide.html">Guide</a></p>

  <div class="card history-table-wrap">
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>Run</th>
          <th>Status</th>
          <th>SAVE rate</th>
          <th>SAVE</th>
          <th>SKIP</th>
          <th>Prompts</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="7" class="sub">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="history-cards" id="history-cards"></div>

  <script src="/js/benchmark-history.js"></script>
  <script src="/js/register-sw.js" defer></script>
</body>
</html>
